<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Beş Stabilite Ayakkabısı Filmi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  /* Layout: film sahnesi. Tam ekran 3D sahne, anlatım paneli bir yanda, altta bölümlü zaman şeridi. */
  --ink:#0C141B; --ink-2:#121D26; --ink-3:#1A2833; --spot:#1B2D3B;
  --line:#2A3B4A; --line-2:#3B5063;
  --paper:#E8EDF1; --mute:#97A7B5; --dim:#67798A;
  --gum:#E3A56F; --sup:#6F9BF0; --sup-soft:rgba(111,155,240,.22);
  --ok:#7FD3A2; --warn:#F1CF5E; --no:#F07B72;
  --glass:rgba(16,26,35,.9);
  --f-disp:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --barh:66px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 58% 52% at var(--sx,62%) var(--sy,48%),var(--spot) 0%,var(--ink) 72%)}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{z-index:0;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#fx{z-index:1;pointer-events:none}
#tags{position:absolute;inset:0;z-index:2;pointer-events:none}
#note3d{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:4;font:500 .66rem/1.3 var(--f-mono);letter-spacing:.1em;color:var(--dim);pointer-events:none;text-align:right;transition:opacity .5s}
#scenes{position:absolute;left:0;right:0;top:0;bottom:calc(var(--barh) + env(safe-area-inset-bottom,0px));z-index:3;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.scene.active{opacity:1;visibility:visible;transition:opacity .7s ease .12s}
.scene.notrans,.scene.notrans *{transition:none!important}
.pe{pointer-events:auto}
.eyebrow{font:600 .7rem/1.25 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gum);margin:0 0 .8rem}
.h1{font-family:var(--f-disp);font-stretch:116%;font-weight:820;font-size:clamp(2.1rem,4.3vw,4rem);line-height:.93;letter-spacing:-.015em;margin:0 0 1.1rem;text-wrap:balance}
.h1 span{display:block}.h1 .acc{color:var(--gum)}
.h2{font-family:var(--f-disp);font-stretch:115%;font-weight:760;font-size:clamp(1.55rem,3.1vw,2.7rem);line-height:1.03;letter-spacing:-.01em;margin:0 0 .7rem;text-wrap:balance}
.lede{font-size:clamp(1.02rem,1.3vw,1.24rem);max-width:36rem;margin:0 0 1rem;line-height:1.45}
p{margin:0 0 .8rem;font-size:clamp(.95rem,1.08vw,1.06rem);max-width:38rem}
.mute{color:var(--mute)}.mono{font-family:var(--f-mono)}.small{font-size:.86rem}
.hint{font:400 .74rem/1.5 var(--f-mono);color:var(--dim);margin-top:1.2rem}
kbd{font:600 .7rem var(--f-mono);border:1px solid var(--line-2);padding:1px 5px;color:var(--mute)}
.r{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.r.in{opacity:1;transform:none}
.r.fade{transform:none}
.chip{display:inline-block;font:600 .64rem/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor;white-space:nowrap}
.chip.cur{color:var(--ok)}.chip.old{color:var(--warn)}

/* layouts (tall first) */
.lay-split .panel{position:absolute;left:0;right:0;top:44%;bottom:0;padding:16px 16px 20px;overflow:auto;display:flex;flex-direction:column;background:linear-gradient(to bottom,rgba(12,20,27,0),var(--ink) 26px)}
.pin{margin:auto 0;min-width:0}
.lay-full .panel{position:absolute;inset:0;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 24px;background:linear-gradient(var(--ink),rgba(12,20,27,.95))}
.lay-full .pin{max-width:1140px;margin:0 auto}
.lay-center .top{position:absolute;left:16px;right:16px;top:calc(18px + env(safe-area-inset-top,0px))}
.lay-center .cap{position:absolute;left:16px;right:16px;bottom:14px;max-width:760px;margin:0 auto;background:var(--glass);border:1px solid var(--line);padding:14px 18px}
@media (min-width:860px) and (min-aspect-ratio:21/20){
  .lay-split .panel{top:0;bottom:0;right:auto;width:min(46vw,600px);padding:clamp(22px,4.5vh,56px) 24px clamp(22px,4.5vh,56px) clamp(24px,5vw,80px);background:none}
  .lay-full .panel{padding:clamp(26px,5vh,54px) clamp(24px,5vw,80px)}
  .lay-center .top{left:clamp(24px,5vw,80px);right:auto;max-width:44rem;top:clamp(24px,5vh,52px)}
  .lay-center .cap{bottom:24px}
}

/* shoe chapter */
.shead{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.shead .brand{font:600 .7rem var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}
.shead h2{font-family:var(--f-disp);font-stretch:118%;font-weight:800;font-size:clamp(1.7rem,3.4vw,2.9rem);line-height:1;margin:0 0 8px}
.shead h2 small{font-size:.42em;font-stretch:100%;color:var(--mute);font-weight:600}
.shead .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.86rem}
.stack{position:relative;min-height:15rem}
.stack>.r{position:absolute;inset:0}
.stack>.r.in{position:relative}
.stack>.r:not(.in){transition:opacity .25s ease,transform .25s ease}
.stack>.r.in{transition-delay:.28s}
.k{display:block;font:600 .64rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sup);margin-bottom:4px}
.distq{border-left:3px solid var(--sup);padding:2px 0 2px 14px;font-size:1.02rem;margin:0 0 10px;max-width:36rem}
.tourcap b{display:block;font-stretch:110%;font-weight:740;font-size:1.2rem;margin-bottom:2px}
.tourcap span{color:var(--mute)}
.vchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.vchip{font:500 .64rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--line);color:var(--dim);transition:all .4s}
.vchip.cur{border-color:var(--gum);color:var(--paper);background:rgba(227,165,111,.12)}
.techl{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.techl li{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:10px;padding:6px 8px;border:1px solid transparent;opacity:.35;transition:opacity .5s,border-color .4s,background .4s}
.techl li.seen{opacity:.75}
.techl li.cur{opacity:1;border-color:var(--gum);background:var(--ink-3)}
.techl .n{width:1.6rem;height:1.6rem;display:grid;place-items:center;font:600 .74rem var(--f-mono);border:1px solid var(--line-2)}
.techl li.main .n{background:var(--sup);border-color:var(--sup);color:var(--ink)}
.techl b{font-weight:700;font-size:.95rem}
.techl p{margin:1px 0 0;font-size:.86rem;color:var(--mute)}
.mechbox{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px;align-items:center}
.mechbox svg{width:100%;height:auto;display:block}
.specs{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:7.2rem minmax(0,1fr) 4.4rem;gap:10px;align-items:center;font-size:.86rem}
.bar .t{height:10px;background:var(--line);position:relative;overflow:hidden}
.bar .t i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gum);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.in .bar .t i,.bar.in .t i{width:var(--w)}
.bar .v{font:600 .86rem var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.wchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.wchip{font:600 .74rem var(--f-mono);padding:3px 8px;border:1px solid var(--line-2);color:var(--dim)}
.wchip.on{border-color:var(--ok);color:var(--ok)}
.fit{display:grid;gap:12px}
@media (min-width:640px){.fit{grid-template-columns:1fr 1fr}}
.fit h3{font:600 .64rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
.fit .p h3{color:var(--ok)}.fit .c h3{color:var(--no)}
.fit ul{margin:0;padding-left:1.05rem;display:grid;gap:6px;font-size:.9rem}

/* mechanisms */
.mechs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-top:14px}
.mech{background:var(--ink-2);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px}
.mech svg{width:100%;height:auto;display:block}
.mech .nm{font:600 .72rem var(--f-mono);letter-spacing:.06em;color:var(--sup);text-transform:uppercase}
.mech .sh{font-weight:700;font-size:.95rem}
.mech p{font-size:.85rem;color:var(--mute);margin:0}
.d-foam{fill:var(--ink-3);stroke:var(--paper);stroke-width:1.2}
.d-rub{fill:#6B5240;stroke:var(--paper);stroke-width:1}
.d-sup{fill:var(--sup-soft);stroke:var(--sup);stroke-width:1.6}
.d-supl{fill:none;stroke:var(--sup);stroke-width:3.2;stroke-linecap:round}
.d-line{fill:none;stroke:var(--mute);stroke-width:1}
.d-txt{font:600 9.5px var(--f-mono);fill:var(--dim);letter-spacing:.08em}
.m-foot{fill:var(--ink-2);stroke:var(--paper);stroke-width:1.4}
.m-ghost{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
.m-gr{stroke:var(--line-2);stroke-width:1}

/* cards */
.needs{display:grid;gap:8px;margin:.6rem 0 1rem}
.need{display:grid;grid-template-columns:2.2rem 1fr;gap:4px 12px;padding:10px 12px;border:1px solid var(--line);background:var(--ink-2)}
.need .ic{grid-row:span 2;font:700 1.1rem var(--f-mono);color:var(--gum)}
.need b{font-weight:700}
.need span{color:var(--mute);font-size:.9rem}
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:7px;max-width:34rem}
.vlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:.92rem}
.vlist li span.d{display:block;color:var(--mute);font-size:.82rem}
.cmp{display:grid;gap:22px;margin-top:12px}
@media (min-width:900px){.cmp{grid-template-columns:1fr 1fr}}
.cmp h3{font:600 .66rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.cmp .bar{grid-template-columns:7.6rem minmax(0,1fr) 3.6rem}
.cmp .bar .t i{background:var(--sup)}
.cmp .bar.best .t i{background:var(--gum)}
.wtab{width:100%;border-collapse:collapse;font-size:.88rem}
.wtab th,.wtab td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.wtab th{font:600 .62rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.wtab td.c{font:600 .8rem var(--f-mono);text-align:center}
.yes{color:var(--ok)}.no{color:var(--dim)}.q{color:var(--warn)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px}
.pick{border:1px solid var(--line);background:var(--ink-2);padding:14px 16px;display:grid;gap:4px}
.pick .k{color:var(--gum)}
.pick b{font-size:1.08rem;font-weight:750}
.pick span{color:var(--mute);font-size:.9rem}
.pick em{font-style:normal;color:var(--warn);font-size:.86rem}
.sumnote{margin-top:14px;border:1px solid var(--sup);padding:12px 14px;font-size:.95rem;max-width:60rem}
.checks{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:8px;max-width:40rem}
.checks li{display:grid;grid-template-columns:1.8rem 1fr;gap:10px;font-size:.96rem;align-items:start}
.checks li i{font-style:normal;width:1.6rem;height:1.6rem;display:grid;place-items:center;border:1px solid var(--line-2);font:600 .74rem var(--f-mono)}
.checks li.in i{border-color:var(--ok);color:var(--ok)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin-top:12px;font-size:.88rem}
.links a{color:var(--sup);text-underline-offset:3px}
.links div{border:1px solid var(--line);padding:10px 12px;background:var(--ink-2)}
.links b{display:block;margin-bottom:4px}

/* tags */
.tag{position:absolute;left:0;top:0;transform:translate(-999px,-999px);opacity:0;transition:opacity .45s,border-color .3s;background:var(--glass);border:1px solid var(--line-2);padding:5px 9px;max-width:240px;white-space:normal}
.tag.on{opacity:1}.tag.hl{border-color:var(--gum)}
.tag b{display:block;font-stretch:90%;font-weight:720;font-size:.84rem}
.tag span{display:block;font:400 .64rem/1.35 var(--f-mono);color:var(--mute);margin-top:1px}
.tag.lt b{font-size:.8rem}.tag.lt span{color:var(--gum)}
@media (max-width:640px){.tag{max-width:150px;padding:4px 7px}.tag b{font-size:.74rem}.tag span{font-size:.58rem}}

/* bar */
#bar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--barh) + env(safe-area-inset-bottom,0px));padding:0 12px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:8px;background:var(--ink-2);border-top:1px solid var(--line);z-index:6}
.btn{appearance:none;border:1px solid var(--line-2);background:transparent;color:var(--paper);height:38px;min-width:38px;padding:0 10px;display:inline-grid;place-items:center;cursor:pointer;font:600 .76rem var(--f-mono);border-radius:0}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn:hover{border-color:var(--gum);color:var(--gum)}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--gum);outline-offset:2px}
.btn.main{background:var(--gum);border-color:var(--gum);color:var(--ink)}
.btn.main:hover{background:transparent;color:var(--gum)}
.bmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:0 6px}
.btitle{display:flex;gap:8px;align-items:baseline;font-size:.82rem;white-space:nowrap;overflow:hidden}
.btitle .no{font:600 .72rem var(--f-mono);color:var(--gum)}
.btitle .nm{overflow:hidden;text-overflow:ellipsis;font-weight:600}
#track{position:relative;height:16px;cursor:pointer;touch-action:none}
#segs{position:absolute;left:0;right:0;top:5px;height:6px;display:flex;gap:2px}
#segs i{display:block;height:100%;background:var(--line);position:relative;overflow:hidden}
#segs i b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gum)}
#knob{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;background:var(--paper);border:2px solid var(--ink);box-shadow:0 0 0 1px var(--gum);pointer-events:none}
#time{font:500 .72rem var(--f-mono);color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:640px){#time,#bPrev,#bSpeed,#note3d{display:none}.btitle{font-size:.76rem}}
#menu{position:absolute;right:12px;bottom:calc(var(--barh) + env(safe-area-inset-bottom,0px) + 8px);z-index:7;width:min(340px,calc(100% - 24px));max-height:min(70vh,560px);overflow:auto;background:var(--ink-2);border:1px solid var(--line-2);padding:12px}
#menu h3{margin:0 0 8px;font:600 .7rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#menu ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#menu button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2rem 1fr auto;gap:8px;width:100%;padding:7px 8px;cursor:pointer;font-size:.86rem}
#menu button:hover,#menu button:focus-visible{background:var(--ink-3)}
#menu button .n,#menu button .t{font:600 .7rem var(--f-mono);color:var(--dim);padding-top:2px}
#menu button.cur{background:var(--ink-3)}#menu button.cur .n{color:var(--gum)}
@media (prefers-reduced-motion:reduce){.r,.bar .t i,.techl li{transition-duration:.01s!important}}
</style>

<div id="app">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="tags" aria-hidden="true"></div>
  <div id="note3d" aria-hidden="true">TEMSİLİ 3D MODEL<br>YÜKSEKLİK VE DROP MARKA VERİSİYLE</div>
  <main id="scenes"></main>
  <nav id="bar" aria-label="Oynatma kontrolleri">
    <button class="btn main" id="bPlay" aria-label="Duraklat"><svg viewBox="0 0 16 16" id="icPlay"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg></button>
    <button class="btn" id="bPrev" aria-label="Önceki bölüm"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="2" height="12"/><path d="M14 2v12L5 8z"/></svg></button>
    <button class="btn" id="bNext" aria-label="Sonraki bölüm"><svg viewBox="0 0 16 16"><rect x="12" y="2" width="2" height="12"/><path d="M2 2v12l9-6z"/></svg></button>
    <div class="bmid">
      <div class="btitle"><span class="no" id="chNo">01</span><span class="nm" id="chName">Açılış</span></div>
      <div id="track" role="slider" aria-label="Zaman çizelgesi" tabindex="0" aria-valuemin="0"><div id="segs"></div><div id="knob"></div></div>
    </div>
    <span id="time">00:00 / 00:00</span>
    <button class="btn" id="bSpeed" aria-label="Oynatma hızı">1×</button>
    <button class="btn" id="bMenu" aria-label="Bölüm listesi" aria-expanded="false">Bölümler</button>
  </nav>
  <div id="menu" hidden><h3>Bölümler</h3><ol id="menuList"></ol></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function kf(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(t<=b[0])return lerp(a[1],b[1],sstep(a[0],b[0],t));}return keys[keys.length-1][1];}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const WQ=matchMedia('(min-width: 860px) and (min-aspect-ratio: 21/20)');
let WIDE=WQ.matches;const A=(w,t)=>WIDE?w:t;

/* ================= DATA (doğrulanmış) ================= */
const SH=[

 kind:'4d',mech:'4D GUIDANCE SYSTEM',mechD:'Ark bölgesindeki köpük modülü (ASICS: “pod”); ayak aşırı yük altında içe çöktükçe direnç gösteriyor. Normal adımda fark edilmiyor.',
 dist:'Desteği ark bölgesindeki ayrı, yüke tepki veren bir köpük modülüyle veren tek model. Topukta ayrıca PureGEL jel yastığı var.',
 H:40,F:32,drop:8,weight:298,widths:['D','2E','4E'],wnote:'4E’nin AB stoğu belirsiz',insole:'Çıkarılabilir · OrthoLite X-55',ts:13,wf:1,

/* ================= mechanism SVG (rear view) ================= */
function mechSVG(s){
 const k=s.kind,cx=110,gy=176,mt=132,wb=(s.wf>1.04)?138:126,wt=wb-14;
 let extra='';
 if(k==='4d')extra=`<path class="d-sup react" d="M${cx-wt/2+4} ${mt+3} L${cx-8} ${mt+3} L${cx-10} ${gy-9} L${cx-wb/2+6} ${gy-9}Z"/>`;
 if(k==='plane')extra=`<path class="d-supl" d="M${cx-wb/2+4} ${gy-24} L${cx+wb/2-4} ${gy-24}"/>`;
 if(k==='hframe')extra=`<path class="d-sup react" d="M${cx-wt/2-2} ${mt-12} L${cx-wt/2+12} ${mt-6} L${cx-wb/2+16} ${gy-8} L${cx-wb/2} ${gy-8}Z"/><path class="d-sup" d="M${cx+wt/2+2} ${mt-12} L${cx+wt/2-12} ${mt-6} L${cx+wb/2-16} ${gy-8} L${cx+wb/2} ${gy-8}Z"/>`;
 if(k==='rails')extra=`<path class="d-sup react" d="M${cx-wt/2} ${mt} L${cx-wt/2-2} ${mt-20} L${cx-wt/2+9} ${mt-20} L${cx-wt/2+11} ${mt}Z"/><path class="d-sup" d="M${cx+wt/2} ${mt} L${cx+wt/2+2} ${mt-20} L${cx+wt/2-9} ${mt-20} L${cx+wt/2-11} ${mt}Z"/>`;
 if(k==='hurr')extra=`<path class="d-sup react" d="M${cx-wt/2-3} ${mt-16} L${cx-wt/2+8} ${mt-4} L${cx-wt/2+8} ${mt+4} L${cx-wt/2-1} ${mt+4}Z"/><path class="d-sup" d="M${cx+wt/2+3} ${mt-10} L${cx+wt/2-8} ${mt-2} L${cx+wt/2-8} ${mt+4} L${cx+wt/2+1} ${mt+4}Z"/>`;
 const foot=`<path class="m-foot" d="M${cx-24} ${mt-44} C${cx-30} ${mt-18} ${cx-24} ${mt} ${cx} ${mt} C${cx+24} ${mt} ${cx+30} ${mt-18} ${cx+24} ${mt-44}"/><path class="d-line" d="M${cx-22} ${mt-44} C${cx-22} ${mt-80} ${cx-26} ${mt-110} ${cx-28} ${mt-128} M${cx+22} ${mt-44} C${cx+22} ${mt-80} ${cx+26} ${mt-110} ${cx+28} ${mt-128}" style="stroke:var(--paper);stroke-width:1.4"/>`;
 const ghost=`<path class="m-ghost" d="M${cx-24} ${mt-44} C${cx-30} ${mt-18} ${cx-24} ${mt} ${cx} ${mt} C${cx+24} ${mt} ${cx+30} ${mt-18} ${cx+24} ${mt-44} M${cx-22} ${mt-44} L${cx-28} ${mt-128} M${cx+22} ${mt-44} L${cx+28} ${mt-128}"/>`;
 return `<svg class="msvg" viewBox="0 0 220 196" role="img" aria-label="${esc(s.mech)} arkadan kavramsal çizim">
  <line class="m-gr" x1="12" x2="208" y1="${gy}" y2="${gy}"/>
  <text class="d-txt" x="16" y="16">İÇ</text><text class="d-txt" x="204" y="16" text-anchor="end">DIŞ</text>
  <g class="ghost" style="transform-origin:${cx}px ${mt}px">${ghost}</g>
  <path class="d-foam" d="M${cx-wt/2} ${mt} L${cx+wt/2} ${mt} L${cx+wb/2} ${gy-6} L${cx-wb/2} ${gy-6}Z"/>
  <path class="d-rub" d="M${cx-wb/2} ${gy-6} L${cx+wb/2} ${gy-6} L${cx+wb/2-2} ${gy} L${cx-wb/2+2} ${gy}Z"/>
  ${extra}
  <g class="heel" style="transform-origin:${cx}px ${mt}px">${foot}</g>
 </svg>`;
}
function poseMechs(root,t){
 const ph=(t/3.2)%1;const s=Math.pow(Math.sin(ph*Math.PI),2);
 root.querySelectorAll('.msvg').forEach(svg=>{const g=svg.querySelector('.ghost'),h=svg.querySelector('.heel'),r=svg.querySelector('.react');g.style.transform=`rotate(${-12*s}deg)`;h.style.transform=`rotate(${-12*s*.42}deg)`;if(r)r.style.fillOpacity=String(.25+.75*s);});
}

/* ================= THREE: parametric shoes ================= */
const L=2.8,X0=-1.4,MM=1/103.6,ux=u=>X0+u*L;
const WK=[[.10,.33],[.25,.355],[.45,.335],[.62,.45],[.74,.475],[.85,.43]];
function baseW(u){if(u<=.10){const t=(.10-u)/.10;return .33*Math.sqrt(Math.max(0,1-t*t));}if(u>=.85){const t=(u-.85)/.15;return .43*Math.sqrt(Math.max(0,1-t*t));}for(let i=0;i<WK.length-1;i++){const a=WK[i],b=WK[i+1];if(u<=b[0]){const s=(u-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*s*s*(3-2*s);}}return .43;}
function halfW0(u,side){let w=baseW(u);if(side<0)w*=1-.17*Math.exp(-Math.pow((u-.42)/.12,2));else w*=1+.03*Math.exp(-Math.pow((u-.7)/.1,2));return w;}
const centerZ=u=>-.07*sstep(.6,1,u);
const UH=[[0,.62],[.08,.66],[.3,.62],[.45,.56],[.6,.46],[.75,.36],[.9,.25],[1,.12]];
function domeH(u){for(let i=0;i<UH.length-1;i++){const a=UH[i],b=UH[i+1];if(u<=b[0]){const s=(u-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*s*s*(3-2*s);}}return .12;}
const alphaO=u=>u<=.40?1.2*Math.sqrt(Math.max(0,1-Math.pow((u-.17)/.23,2))):0;
function col(h){return new THREE.Color(h).convertSRGBToLinear();}
function std(hex,o={}){return new THREE.MeshStandardMaterial(Object.assign({color:col(hex),roughness:.75,metalness:0,side:THREE.DoubleSide},o));}
function canvasTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
const V=a=>new THREE.Vector3(a[0],a[1],a[2]);
let SUPMAT=null,TEX={};

function Shoe(c){
 const Hs=c.H*MM,Fs=c.F*MM,TS=c.ts*MM,OUT=.045,INS=.035;
 const W=(u,s)=>halfW0(u,s)*c.wf;
 const rockY=u=>TS*Math.pow(clamp((u-.62)/.38),2)+.05*Math.pow(clamp((.13-u)/.13),2);
 const stack=u=>u<.18?Hs:u<.62?lerp(Hs,Fs,sstep(.18,.62,u)):Fs*(1-.22*sstep(.86,1,u));
 const midBot=u=>rockY(u)+OUT,midTop=u=>rockY(u)+stack(u)-INS;
 const sp=(u,th,k=1,hk=1)=>{const cc=Math.cos(th),s=Math.max(0,Math.sin(th));const side=cc>=0?1:-1;const w=W(u,side)*k;return [ux(u),midTop(u)-.02+domeH(u)*hk*Math.pow(s,.8),centerZ(u)+side*w*Math.pow(Math.abs(cc),.55)];};
 function outline(k=1,uPad=0,n=110){const us=[];for(let i=0;i<=n;i++){const t=i/n;us.push(uPad+(1-2*uPad)*(1-Math.cos(Math.PI*t))/2);}const pts=[];us.forEach(u=>pts.push([ux(u),-(centerZ(u)+W(u,1)*k)]));for(let i=us.length-1;i>=0;i--){const u=us[i];pts.push([ux(u),-(centerZ(u)-W(u,-1)*k)]);}const out=[];pts.forEach(p=>{const l=out[out.length-1];if(!l||Math.hypot(l.x-p[0],l.y-p[1])>1e-5)out.push(new THREE.Vector2(p[0],p[1]));});if(out.length>2&&out[0].distanceTo(out[out.length-1])<1e-5)out.pop();return out;}
 function extrude(pts,yAt){const g=new THREE.ExtrudeGeometry(new THREE.Shape(pts),{depth:1,bevelEnabled:false,curveSegments:2});g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),f=p.getY(i),z=p.getZ(i);p.setY(i,yAt(clamp((x-X0)/L),f,z));}g.computeVertexNormals();return g;}
 const layer=(k,uPad,yAt)=>extrude(outline(k,uPad),yAt);
 function region(u0,u1,fr0,fr1,side,yAt,n=30){const pts=[];for(let i=0;i<=n;i++){const u=u0+(u1-u0)*i/n;pts.push(new THREE.Vector2(ux(u),-(centerZ(u)+side*W(u,side)*fr1)));}for(let i=n;i>=0;i--){const u=u0+(u1-u0)*i/n;pts.push(new THREE.Vector2(ux(u),-(centerZ(u)+side*W(u,side)*fr0)));}return extrude(pts,yAt);}
 function band(side,u0,u1,yb,yt,k=1.02,n=36){const pos=[],idx=[];for(let i=0;i<=n;i++){const u=u0+(u1-u0)*i/n;const x=ux(u),z=centerZ(u)+side*W(u,side)*k;pos.push(x,yb(u),z,x,yt(u),z);}for(let i=0;i<n;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;}
 function shell(o){const u0=o.u0??0,u1=o.u1??1,nu=o.nu??70,th0=o.th0??0,th1=o.th1??Math.PI,nv=o.nv??36,k=o.k??1,hk=o.hk||(()=>1),keep=o.keep,cos=o.cos!==false;const pos=[],uv=[],idx=[],U=[],T=[];for(let i=0;i<=nu;i++){let t=i/nu;if(cos)t=(1-Math.cos(Math.PI*t))/2;U.push(u0+(u1-u0)*t);}for(let j=0;j<=nv;j++)T.push(th0+(th1-th0)*j/nv);U.forEach(u=>T.forEach((th,j)=>{pos.push(...sp(u,th,k,hk(u)));uv.push(u*6,j/nv*2);}));for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){if(keep&&!keep((U[i]+U[i+1])/2,(T[j]+T[j+1])/2))continue;const a=i*(nv+1)+j,b=a+nv+1;idx.push(a,b,a+1,b,b+1,a+1);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g;}
 function pgeo(nu,nv,fn,k=1,hk=1){const pos=[],uv=[],idx=[];for(let i=0;i<=nu;i++)for(let j=0;j<=nv;j++){const q=fn(i/nu,j/nv);pos.push(...sp(q[0],q[1],k,hk));uv.push(q[0]*6,j/nv*2);}for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+nv+1;idx.push(a,b,a+1,b,b+1,a+1);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g;}
 const tube=(pts,r,mat,closed=false,seg=120)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,closed),seg,r,8,closed),mat);
 const edge=(u,y,s)=>new THREE.Vector3(ux(u),y,centerZ(u)+s*W(u,s));
 const po={polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2};
 const M={
  upper:std('#ffffff',{map:TEX.mesh,color:col(c.col.up),roughness:.85}),
  tongue:std(c.col.up,{roughness:.9}),collar:std(c.col.dark,{roughness:.7}),
  counter:std(c.col.dark,Object.assign({roughness:.55},po)),toe:std(c.col.dark,Object.assign({roughness:.6},po)),
  lace:std(c.col.lace,{roughness:.6}),eye:std('#1E2A33',{metalness:.6,roughness:.35}),
  mid:std('#EEF0F2',{roughness:.55}),mid2:std('#D9DEE3',{roughness:.6}),
  outCap:std('#ffffff',{map:TEX.tread,color:col(c.col.out),roughness:.85}),outSide:std(c.col.out,{roughness:.8}),
  ins:std('#ffffff',{map:TEX.ins,roughness:.9}),
  sup:std('#5F8FEE',{roughness:.45,emissive:col('#16306A'),emissiveIntensity:.6}),

 items.forEach(it=>{it.t.el.style.transform=`translate(${it.x.toFixed(1)}px,${it.y.toFixed(1)}px)`;if(it.line){const ex=it.lf?it.x+it.t.w:it.x,ey=it.y+it.t.h/2;g.strokeStyle=it.hl?gum:'rgba(232,237,241,.55)';g.lineWidth=1;g.beginPath();g.moveTo(it.p[0],it.p[1]);g.lineTo(ex,ey);g.stroke();g.fillStyle=g.strokeStyle;g.beginPath();g.arc(it.p[0],it.p[1],3,0,7);g.fill();}});
}

/* ================= controls ================= */
const segs=$('#segs');SC.forEach((s,i)=>{const e=document.createElement('i');e.style.flex=`${s.dur} 1 0`;e.title=`${i+1}. ${s.title}`;e.appendChild(document.createElement('b'));segs.appendChild(e);});
const segFills=$$('#segs i b');
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const menuList=$('#menuList');SC.forEach((s,i)=>{const li=document.createElement('li');li.innerHTML=`<button type="button"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(s.title)}</span><span class="t">${fmt(s.start)}</span></button>`;li.firstChild.addEventListener('click',()=>{seek(s.start+.01);toggleMenu(false);if(!playing)setPlaying(true);});menuList.appendChild(li);});
function setPlaying(p){if(p&&T>=TOTAL-.05)seek(0);playing=p;$('#bPlay').setAttribute('aria-label',p?'Duraklat':'Oynat');$('#icPlay').innerHTML=p?'<rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/>':'<path d="M3 2v12l11-6z"/>';}
function seek(t){T=clamp(t,0,TOTAL);}
function toggleMenu(f){const m=$('#menu');const show=f!=null?f:m.hidden;m.hidden=!show;$('#bMenu').setAttribute('aria-expanded',String(show));}
function prev(){const i=sceneAt(T);if(T-SC[i].start>2.5||i===0)seek(SC[i].start+.01);else seek(SC[i-1].start+.01);}
$('#bPlay').addEventListener('click',()=>setPlaying(!playing));
$('#bNext').addEventListener('click',()=>{const i=sceneAt(T);if(i<SC.length-1)seek(SC[i+1].start+.01);});
$('#bPrev').addEventListener('click',prev);
$('#bSpeed').addEventListener('click',()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];$('#bSpeed').textContent=speed+'×';});
$('#bMenu').addEventListener('click',()=>toggleMenu());
const track=$('#track');let tdrag=false;const trackSeek=e=>{const r=track.getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width)*TOTAL);};
track.addEventListener('pointerdown',e=>{tdrag=true;track.setPointerCapture(e.pointerId);trackSeek(e);});
track.addEventListener('pointermove',e=>{if(tdrag)trackSeek(e);});track.addEventListener('pointerup',()=>{tdrag=false;});
track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){seek(T+5);e.preventDefault();e.stopPropagation();}if(e.key==='ArrowLeft'){seek(T-5);e.preventDefault();e.stopPropagation();}});
window.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button,a'))return;if(e.key===' '||e.code==='Space'){e.preventDefault();setPlaying(!playing);}else if(e.key==='ArrowRight')$('#bNext').click();else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape')toggleMenu(false);});
document.addEventListener('pointerdown',e=>{const m=$('#menu');if(!m.hidden&&!m.contains(e.target)&&!$('#bMenu').contains(e.target))toggleMenu(false);});
const glc=$('#gl');let lx=0,ly=0;
glc.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;glc.setPointerCapture(e.pointerId);glc.classList.add('drag');});
glc.addEventListener('pointermove',e=>{if(!drag)return;uAzT-=(e.clientX-lx)*.45;uElT=clamp(uElT+(e.clientY-ly)*.3,-60,60);lx=e.clientX;ly=e.clientY;});
const endDrag=()=>{drag=false;glc.classList.remove('drag');};glc.addEventListener('pointerup',endDrag);glc.addEventListener('pointercancel',endDrag);

function resize(){FW=innerWidth;FH=innerHeight;const dpr=Math.min(2,devicePixelRatio||1);fx.width=Math.round(FW*dpr);fx.height=Math.round(FH*dpr);fctx.setTransform(dpr,0,0,dpr,0,0);if(renderer)renderer.setSize(FW,FH,false);_barH=$('#bar').offsetHeight||66;WIDE=WQ.matches;measureTags();if(curScene>=0)bounds(SC[curScene]);}
window.addEventListener('resize',resize);
let last=performance.now(),clock=0;
function frame(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;clock+=dt;
 if(playing){T+=dt*speed;if(T>=TOTAL){T=TOTAL;setPlaying(false);}}
 const i=sceneAt(Math.min(T,TOTAL-.001));if(i!==curScene)activate(i);
 const s=SC[i],lt=T-s.start;updateScene(s,lt);
 const st=Object.assign({},DEF,s.state?s.state(lt):{});
 step3D(st,dt,clock);stepFx(s,st,dt,clock);
 SC.forEach((c,k)=>{const p=clamp((T-c.start)/c.dur);const f=segFills[k];const w=(p*100).toFixed(2)+'%';if(f._w!==w){f._w=w;f.style.width=w;}});
 $('#knob').style.left=(T/TOTAL*100).toFixed(3)+'%';
 const tt=fmt(T)+' / '+fmt(TOTAL);const te=$('#time');if(te._t!==tt){te._t=tt;te.textContent=tt;track.setAttribute('aria-valuenow',Math.round(T));}
 requestAnimationFrame(frame);
}
function start(d){init3D();resize();track.setAttribute('aria-valuemax',Math.round(TOTAL));if(d&&typeof d.T==='number')T=clamp(d.T,0,TOTAL);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measureTags);requestAnimationFrame(t=>{last=t;frame(t);});}
try{window.claude?.hot?.snapshot?.(()=>({T}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
