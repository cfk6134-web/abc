<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Erkek Ayakkabısı Karar Raporu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  /* Layout: film sahnesi. Tam ekran 3D sahne, anlatım panelleri sahnenin bir yanında, altta bölümlü zaman şeridi. */
  --ink:#0C141B; --ink-2:#121D26; --ink-3:#1A2833; --spot:#1B2D3B;
  --line:#2A3B4A; --line-2:#3B5063;
  --paper:#E8EDF1; --mute:#97A7B5; --dim:#67798A;
  --gum:#E3A56F; --delft:#7FA6EE;
  --ok:#7FD3A2; --warn:#F1CF5E; --no:#F07B72;
  --glass:rgba(16,26,35,.88);
  --f-disp:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --barh:66px;
  --fs-hero:clamp(2.5rem,6.6vw,6rem);
  --fs-h2:clamp(1.65rem,3.3vw,2.85rem);
  --fs-body:clamp(.97rem,1.1vw,1.1rem);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 58% 52% at var(--sx,62%) var(--sy,48%),var(--spot) 0%,var(--ink) 72%)}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{z-index:0;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#fx{z-index:1;pointer-events:none}
#tags{position:absolute;inset:0;z-index:2;pointer-events:none}
#hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:4;font:500 .68rem/1 var(--f-mono);letter-spacing:.12em;color:var(--dim);pointer-events:none;transition:opacity .5s}
#scenes{position:absolute;left:0;right:0;top:0;bottom:calc(var(--barh) + env(safe-area-inset-bottom,0px));z-index:3;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.scene.active{opacity:1;visibility:visible;transition:opacity .7s ease .12s}
.scene.notrans,.scene.notrans *{transition:none!important}
.pe{pointer-events:auto}

/* type */
.eyebrow{font:600 .7rem/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gum);margin:0 0 .9rem}
.h1{font-family:var(--f-disp);font-stretch:125%;font-weight:820;font-size:var(--fs-hero);line-height:.92;letter-spacing:-.015em;margin:0 0 1.2rem;text-wrap:balance}
.h1 span{display:block}
.h1 .acc{color:var(--gum)}
.h2{font-family:var(--f-disp);font-stretch:115%;font-weight:760;font-size:var(--fs-h2);line-height:1.02;letter-spacing:-.01em;margin:0 0 .8rem;text-wrap:balance}
.lede{font-size:clamp(1.05rem,1.35vw,1.28rem);color:var(--paper);max-width:36rem;margin:0 0 1rem;line-height:1.45}
p{margin:0 0 .8rem;font-size:var(--fs-body);max-width:38rem}
.mute{color:var(--mute)}
.mono{font-family:var(--f-mono)}
.small{font-size:.86rem}
.quote{font-family:var(--f-disp);font-stretch:100%;font-weight:600;font-size:clamp(1.1rem,1.6vw,1.45rem);line-height:1.3;border-left:2px solid var(--gum);padding:.2rem 0 .2rem 1rem;margin:1.2rem 0;max-width:34rem}
.hint{font:400 .74rem/1.5 var(--f-mono);color:var(--dim);margin-top:1.4rem}
kbd{font:600 .7rem var(--f-mono);border:1px solid var(--line-2);padding:1px 5px;color:var(--mute)}

/* reveal */
.r{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.r.in{opacity:1;transform:none}
.r.fade{transform:none}

/* layouts: tall first */
.lay-split .panel{position:absolute;left:0;right:0;top:45%;bottom:0;padding:18px 16px 22px;overflow:auto;display:flex;flex-direction:column;background:linear-gradient(to bottom,rgba(12,20,27,0),var(--ink) 28px)}
.pin{margin:auto 0;min-width:0}
.lay-center .top{position:absolute;left:16px;right:16px;top:calc(18px + env(safe-area-inset-top,0px))}
.lay-center .cap{position:absolute;left:16px;right:16px;bottom:14px;max-width:780px;margin:0 auto;background:var(--glass);border:1px solid var(--line);padding:14px 18px;backdrop-filter:blur(6px)}
.lay-center .cap.left{margin:0}
.lay-full .panel,.lay-cat .panel{position:absolute;inset:0;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 24px}
.lay-full .panel{background:linear-gradient(var(--ink),rgba(12,20,27,.94))}
.lay-full .pin{max-width:1120px;margin:0 auto}
.lay-cat .grid{display:grid;gap:18px}
@media (min-width:860px) and (min-aspect-ratio:21/20){
  .lay-split .panel{top:0;bottom:0;right:auto;width:min(47vw,610px);padding:clamp(24px,5vh,64px) 24px clamp(24px,5vh,64px) clamp(24px,5vw,84px);background:none}
  .lay-center .top{left:clamp(24px,5vw,84px);right:auto;max-width:44rem;top:clamp(24px,5vh,56px)}
  .lay-center .cap{bottom:24px;left:24px;right:24px}
  .lay-center .cap.left{left:clamp(24px,5vw,84px);right:auto;max-width:520px}
  .lay-full .panel{padding:clamp(28px,5vh,56px) clamp(24px,5vw,80px)}
  .lay-cat .panel{padding:clamp(24px,4vh,44px) clamp(24px,4vw,64px)}
  .lay-cat .grid{grid-template-columns:minmax(280px,.78fr) minmax(0,1.32fr);gap:clamp(24px,3.4vw,56px);align-items:start}
  .lay-cat .lc{position:sticky;top:0}
}

/* intro */
.intro .lede{max-width:32rem}

/* profile viz */
.viz{position:absolute;left:16px;right:16px;top:12px;height:calc(45% - 16px)}
.viz canvas{width:100%;height:100%;display:block}
@media (min-width:860px) and (min-aspect-ratio:21/20){.viz{left:48%;right:3%;top:6%;height:auto;bottom:5%}}
.finds{list-style:none;padding:0;margin:.4rem 0 1rem;display:grid;gap:8px}
.finds li{display:grid;grid-template-columns:2.2rem 1fr;gap:2px 10px;padding:9px 12px;border:1px solid transparent;transition:opacity .7s,transform .8s,border-color .4s,background .4s}
.finds li .n{grid-row:span 2;font:600 .78rem var(--f-mono);color:var(--dim);padding-top:3px}
.finds li b{font-stretch:100%;font-weight:680;font-size:1.02rem}
.finds li span{color:var(--mute);font-size:.92rem;line-height:1.4}
.finds li.cur{border-color:var(--line-2);background:var(--ink-3)}
.finds li.cur .n{color:var(--gum)}
.sought{border:1px solid var(--gum);padding:12px 14px;font-size:.98rem;max-width:36rem}
.sought b{color:var(--gum);font-weight:650}

/* tur chips */
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:.6rem}
.vchip{font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--line);color:var(--dim);transition:all .4s}
.vchip.cur{border-color:var(--gum);color:var(--paper);background:rgba(227,165,111,.12)}
.capstack{position:relative;min-height:4.4rem}
.capstack>div{position:absolute;inset:0}
.capstack>div.in{position:relative}
.capstack>div:not(.in),.dstack>div:not(.in){transition:opacity .25s ease,transform .25s ease}
.capstack>div.in,.dstack>div.in{transition-delay:.28s}
.capstack b{display:block;font-stretch:110%;font-weight:720;font-size:1.15rem;margin-bottom:2px}
.capstack span{color:var(--mute);font-size:.98rem}

/* tags */
.tag{position:absolute;left:0;top:0;transform:translate(-999px,-999px);opacity:0;transition:opacity .45s,border-color .3s;background:var(--glass);border:1px solid var(--line-2);padding:6px 10px;max-width:230px;white-space:normal}
.tag.on{opacity:1}
.tag.hl{border-color:var(--gum)}
.tag b{display:block;font-stretch:88%;font-weight:720;font-size:.86rem;letter-spacing:.01em}
.tag span{display:block;font:400 .66rem/1.35 var(--f-mono);color:var(--mute);margin-top:2px}
@media (max-width:640px){.tag{max-width:150px;padding:4px 7px}.tag b{font-size:.76rem}.tag span{font-size:.6rem}}

/* detail cards in center layouts */
.dstack{position:relative;min-height:6rem}
.dstack>div{position:absolute;inset:0}
.dstack>div.in{position:relative}
.dstack h3{font-stretch:110%;font-weight:740;font-size:1.2rem;margin:0 0 4px}
.dstack p{color:var(--mute);margin:0;font-size:.97rem}
.dstack .why{display:block;margin-top:6px;font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gum)}

/* steps */
.steps{list-style:none;padding:0;margin:.4rem 0 1rem;display:grid;gap:7px}
.steps li{display:grid;grid-template-columns:1.9rem 1fr;gap:10px;align-items:start;padding:7px 10px;border:1px solid transparent;transition:opacity .7s,transform .8s,border-color .4s,background .4s}
.steps li .n{font:600 .76rem var(--f-mono);color:var(--dim);border:1px solid var(--line-2);height:1.6rem;display:grid;place-items:center}
.steps li.cur{border-color:var(--line-2);background:var(--ink-3)}
.steps li.cur .n{border-color:var(--gum);color:var(--gum)}
.steps li.done .n{background:var(--line);color:var(--paper)}
.steps li p{margin:0;font-size:.95rem}
.warnbox{border:1px dashed var(--warn);color:var(--paper);padding:10px 12px;font-size:.92rem;max-width:36rem}
.warnbox b{color:var(--warn)}

/* gates */
.gates{display:grid;gap:8px;margin:.4rem 0 1rem}
.gate{display:grid;grid-template-columns:2.4rem 1fr;gap:4px 12px;padding:10px 12px;border:1px solid var(--line);transition:opacity .7s,transform .8s,border-color .4s,background .4s}
.gate.cur{border-color:var(--gum);background:var(--ink-3)}
.gate .ck{grid-row:span 2;width:2.1rem;height:2.1rem;border:1px solid var(--line-2);display:grid;place-items:center}
.gate .ck svg{width:20px;height:20px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gate .ck path{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .7s ease .5s}
.gate.in .ck path{stroke-dashoffset:0}
.gate b{font-weight:680;font-size:1rem}
.gate span{color:var(--mute);font-size:.9rem;line-height:1.4}

/* gait */
.gait{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.gait text{font:500 11px var(--f-mono);fill:var(--mute)}
.gait .seg{fill:var(--line)}
.gait .seg.cur{fill:var(--gum)}

/* rejected */
.rej{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:1.2rem}
.rcard{position:relative;border:1px solid var(--line);background:var(--ink-2);padding:14px 16px 16px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;overflow:hidden}
.rcard svg.ic{width:52px;height:52px;fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rcard h3{font-size:1rem;font-weight:680;margin:0 0 3px;font-stretch:100%;padding-right:70px}
.rcard p{font-size:.88rem;color:var(--mute);margin:0}
.rcard .x{position:absolute;right:12px;top:12px;font:700 .64rem var(--f-mono);letter-spacing:.14em;color:var(--no);border:1px solid var(--no);padding:3px 6px;opacity:0;transform:scale(1.6) rotate(-8deg);transition:all .45s cubic-bezier(.3,1.6,.5,1)}
.rcard.struck .x{opacity:1;transform:rotate(-8deg)}
.rcard.struck svg.ic{stroke:var(--dim)}
.rcard.struck h3{text-decoration:line-through;text-decoration-color:var(--no);text-decoration-thickness:2px}
.rcard.struck{border-color:rgba(240,123,114,.4)}

/* brands */
.bgroups{display:grid;gap:10px;margin-top:1rem}
.bg{display:grid;gap:8px;border:1px solid var(--line);padding:12px 14px;background:var(--ink-2)}
@media (min-width:860px){.bg{grid-template-columns:200px 1fr 300px;align-items:start;gap:16px}}
.bg h3{margin:0;font-size:.95rem;font-weight:680}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:500 .72rem var(--f-mono);padding:4px 7px;border:1px solid var(--line-2);color:var(--paper);transition:opacity .6s,transform .7s,border-color .5s,background .5s}
.judged .chip.fin{border-color:var(--gum);background:rgba(227,165,111,.14)}
.judged .chip.in:not(.fin){opacity:.32}
.bg .dec{font-size:.84rem;color:var(--mute);margin:0}
.tally{display:flex;flex-wrap:wrap;gap:14px 28px;margin-top:1.1rem;align-items:baseline}
.tally div{display:flex;gap:10px;align-items:baseline}
.tally b{font:600 2rem/1 var(--f-mono);color:var(--paper)}
.tally b.g{color:var(--gum)}
.tally span{font-size:.86rem;color:var(--mute)}

/* category */
.box{border:1px solid var(--line-2);background:var(--ink-2)}
.box-top{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font:500 .64rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:1px dashed var(--line-2)}
.box-main{display:flex;align-items:center;gap:14px;padding:14px 14px 10px}
.box-main svg{width:46px;height:46px;flex:none;fill:none;stroke:var(--gum);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.box-main h2{margin:0;font-stretch:118%;font-weight:800;font-size:clamp(1.5rem,2.8vw,2.4rem);line-height:1;text-wrap:balance}
.box-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.box-fields>div{padding:8px 12px;min-width:0}
.box-fields>div+div{border-left:1px solid var(--line)}
.box-fields .k{display:block;font:500 .6rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.box-fields .v{display:block;font-size:.84rem;font-weight:600;margin-top:2px;line-height:1.25}
.season .w{display:none;color:var(--delft)}
.winter .season .s{display:none}
.winter .season .w{display:inline}
.season .s{color:var(--gum)}
.principle{margin-top:14px;font-size:clamp(1rem,1.2vw,1.12rem);line-height:1.5}
.rlist-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.spill{font:600 .68rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border:1px solid var(--gum);color:var(--gum);transition:all .5s}
.winter .spill{border-color:var(--delft);color:var(--delft)}
.spill .w{display:none}.winter .spill .s{display:none}.winter .spill .w{display:inline}
.rows{position:relative;transition:height .6s}
.row{position:absolute;left:0;right:0;top:0;--dx:28px;--y:0px;transform:translate(var(--dx),var(--y));opacity:0;transition:transform .9s cubic-bezier(.2,.75,.2,1),opacity .6s,border-color .4s,background .4s;display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--ink-2)}
.row.in{opacity:1;--dx:0px}
.row.focus{border-color:var(--gum);background:var(--ink-3)}
.winter .row.focus{border-color:var(--delft)}
.rk{font:600 1.5rem/1 var(--f-mono);color:var(--gum);padding-top:2px}
.winter .rk{color:var(--delft)}
.rm{font-weight:700;font-size:1.04rem;font-stretch:100%;margin-bottom:4px}
.rd{display:grid;gap:4px 18px}
@media (min-width:1100px){.rd{grid-template-columns:1fr 1fr}}
.rd p{margin:0;font-size:.88rem;line-height:1.4;color:var(--mute)}
.lb{display:inline-block;font:600 .6rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;margin-right:7px;padding:1px 5px;border:1px solid}
.lb.ok{color:var(--ok);border-color:rgba(127,211,162,.5)}
.lb.wn{color:var(--warn);border-color:rgba(241,207,94,.5)}
.notes{margin-top:12px;display:grid;gap:8px}
.note{font-size:.9rem;padding:10px 12px;border:1px dashed var(--line-2);color:var(--paper)}
.note b{font-weight:650}
.note.wn{border-color:rgba(127,166,238,.6)}
.note.wn b{color:var(--delft)}

/* rain table */
.tbl-wrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line)}
table.rain{border-collapse:collapse;width:100%;min-width:620px;font-size:.9rem}
.rain th,.rain td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.rain th{font:600 .66rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);background:var(--ink-2)}
.rain td.m{font-weight:650}
.rain td.nt{color:var(--mute);font-size:.84rem}
.rain tr{transition:opacity .6s}
.cell{display:inline-block;font:600 .72rem var(--f-mono);padding:4px 8px;border:1px solid;opacity:0;transform:scale(.6);transition:all .45s cubic-bezier(.3,1.5,.5,1)}
.cell.in{opacity:1;transform:none}
.cell.e{color:var(--ok);border-color:var(--ok)}
.cell.d{color:var(--warn);border-color:var(--warn)}
.cell.h{color:var(--no);border-color:var(--no)}

/* signals */
.sig{display:flex;flex-wrap:wrap;gap:8px;margin:1rem 0}
.sig span{font-size:.92rem;padding:8px 12px;border:1px solid rgba(240,123,114,.55);background:rgba(240,123,114,.08)}
.bigcall{font-family:var(--f-disp);font-stretch:112%;font-weight:720;font-size:clamp(1.25rem,2.2vw,1.9rem);line-height:1.2;max-width:44rem;margin:1.2rem 0}
.bigcall em{font-style:normal;color:var(--gum)}

/* donut */
.qwrap{display:grid;gap:24px;align-items:center;margin-top:1rem}
@media (min-width:860px){.qwrap{grid-template-columns:minmax(260px,380px) 1fr}}
.qwrap svg{width:100%;max-width:380px;height:auto;display:block;margin:0 auto}
.qwrap svg text{fill:var(--paper)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.legend li{display:grid;grid-template-columns:14px 3.2rem 1fr;gap:10px;align-items:baseline;font-size:.95rem}
.legend i{width:12px;height:12px;display:block;transform:translateY(1px)}
.legend b{font:600 1.05rem var(--f-mono);text-align:right}

/* summary cards */
.sum{display:grid;gap:10px}
.scard{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:12px 14px;border:1px solid var(--line);background:var(--ink-2);transition:opacity .7s,transform .8s,border-color .4s,background .4s}
.scard.cur{border-color:var(--gum);background:var(--ink-3)}
.scard .k{font:600 .64rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gum)}
.scard .m{font-weight:720;font-size:1.08rem}
.scard .w{color:var(--mute);font-size:.9rem}

/* bar */
#bar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--barh) + env(safe-area-inset-bottom,0px));padding:0 12px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:8px;background:var(--ink-2);border-top:1px solid var(--line);z-index:6}
.btn{appearance:none;border:1px solid var(--line-2);background:transparent;color:var(--paper);height:38px;min-width:38px;padding:0 10px;display:inline-grid;place-items:center;cursor:pointer;font:600 .76rem var(--f-mono);border-radius:0}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn:hover{border-color:var(--gum);color:var(--gum)}
.btn:focus-visible{outline:2px solid var(--gum);outline-offset:2px}
.btn.main{background:var(--gum);border-color:var(--gum);color:var(--ink)}
.btn.main:hover{background:transparent;color:var(--gum)}
.bmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:0 6px}
.btitle{display:flex;gap:8px;align-items:baseline;font-size:.82rem;white-space:nowrap;overflow:hidden}
.btitle .no{font:600 .72rem var(--f-mono);color:var(--gum)}
.btitle .nm{overflow:hidden;text-overflow:ellipsis;font-weight:600}
#track{position:relative;height:16px;cursor:pointer;touch-action:none}
#segs{position:absolute;left:0;right:0;top:5px;height:6px;display:flex;gap:2px}
#segs i{display:block;height:100%;background:var(--line);position:relative;overflow:hidden}
#segs i b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gum)}
#segs i:hover{background:var(--line-2)}

 const tt=fmt(T)+' / '+fmt(TOTAL);if($('#time')._t!==tt){$('#time')._t=tt;$('#time').textContent=tt;track.setAttribute('aria-valuenow',Math.round(T));}
 requestAnimationFrame(frame);
}
function start(d){
 init3D();resize();track.setAttribute('aria-valuemax',Math.round(TOTAL));
 if(d&&typeof d.T==='number')T=clamp(d.T,0,TOTAL);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measureTags();});
 requestAnimationFrame(t=>{last=t;frame(t);});
}
try{window.claude?.hot?.snapshot?.(()=>({T}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
